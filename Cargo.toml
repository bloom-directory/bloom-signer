[workspace]
members = [
  "crates/bloom-signer-api",
  "crates/bloom-signer-backend-api",
  "crates/bloom-signer-backend-local",
  "crates/bloom-signer-backend-aws-kms",
  "crates/bloom-signer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
bloom-signer-api = { path = "crates/bloom-signer-api" }
bloom-rpc-wire = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "46bd0d0dc6c1cddc4dbdccd52693072d216e6284" }
bloom-triad-local-transport = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "46bd0d0dc6c1cddc4dbdccd52693072d216e6284" }
bloom-audit-checkpoint = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "46bd0d0dc6c1cddc4dbdccd52693072d216e6284" }
bloom-service-activation = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "46bd0d0dc6c1cddc4dbdccd52693072d216e6284" }
bloom-trusted-time = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "46bd0d0dc6c1cddc4dbdccd52693072d216e6284" }
bloom-platform-containment = { git = "https://github.com/bloom-directory/bloom-service-runtime.git", rev = "46bd0d0dc6c1cddc4dbdccd52693072d216e6284" }
aws-config = { version = "=1.8.1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-credential-types = "1"
# Exact AWS service pins preserve the workspace's declared Rust 1.85 floor.
aws-sdk-kms = "=1.77.0"
aws-sdk-sts = "=1.76.0"
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
aws-types = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
futures = "0.3"
bip32 = { version = "0.5", features = ["secp256k1"] }
blake3 = "1"
chacha20poly1305 = "0.10"
ciborium = "0.2"
ed25519-dalek = "2"
hex = "0.4"
libc = "0.2"
hpke = { version = "0.11", features = ["x25519"] }
hkdf = "0.12"
hmac = "0.12"
k256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
parking_lot = "0.12"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_jcs = "0.2"
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
