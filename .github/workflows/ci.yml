name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Assert Bloom product repo is absent
        run: |
          if grep -Fq 'source = "git+https://github.com/bloom-directory/bloom.git' Cargo.lock; then
            echo 'Cargo.lock must not resolve packages from the Bloom product repository' >&2
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features --locked
      # `--all-features` turns on `triad-dev-harness`, so every step above
      # builds the harness arm of each `#[cfg(feature = ...)]` and never the
      # one that ships. Release behaviour was going unlinted and untested.
      - name: Run clippy on the shipped feature set
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests on the shipped feature set
        run: cargo test --workspace --locked
      # The TTL gates are mint-time behaviour that depends on both the build
      # and the environment, so each configuration needs its own test process.
      # The ignored tests assert their own BLOOM_TRIAD_DEVELOPER_ROOT
      # precondition; `env -u` keeps a runner-provided value from quietly
      # changing which configuration runs, and the dummy root path never needs
      # to exist because the library gate checks presence only.
      - name: Exercise the ceremony TTL gates in every build and environment
        run: |
          env -u BLOOM_TRIAD_DEVELOPER_ROOT cargo test -p bloom-signer --locked \
            --test w5_ceremony custody_ceremony_keeps_the_five_minute_window_without_a_developer_root -- --exact --ignored
          env -u BLOOM_TRIAD_DEVELOPER_ROOT cargo test -p bloom-signer --features triad-dev-harness --locked \
            --test w5_ceremony custody_ceremony_keeps_the_five_minute_window_without_a_developer_root -- --exact --ignored
          BLOOM_TRIAD_DEVELOPER_ROOT=/tmp/bloom-triad-developer-root cargo test -p bloom-signer --locked \
            --test w5_ceremony custody_ceremony_window_requires_both_the_harness_build_and_a_developer_root -- --exact --ignored
          BLOOM_TRIAD_DEVELOPER_ROOT=/tmp/bloom-triad-developer-root cargo test -p bloom-signer --features triad-dev-harness --locked \
            --test w5_ceremony custody_ceremony_window_requires_both_the_harness_build_and_a_developer_root -- --exact --ignored
          BLOOM_TRIAD_DEVELOPER_ROOT=/tmp/bloom-triad-developer-root cargo test -p bloom-signer --locked \
            --test w5_ceremony approval_ceremony_extends_to_but_never_past_its_terms_under_the_developer_ttl -- --exact --ignored
          BLOOM_TRIAD_DEVELOPER_ROOT=/tmp/bloom-triad-developer-root cargo test -p bloom-signer --features triad-dev-harness --locked \
            --test w5_ceremony approval_ceremony_extends_to_but_never_past_its_terms_under_the_developer_ttl -- --exact --ignored
      - name: Keep the accepted time advisory out of the default artifact
        run: |
          if cargo tree --locked -p bloom-signer -e normal --prefix none | grep -Eq '^time v'; then
            echo 'the default bloom-signer graph must not contain time while RUSTSEC-2026-0009 is ignored for the optional AWS KMS graph' >&2
            exit 1
          fi

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Advisories, licences, sources, and wildcard pins, configured in
      # deny.toml. Runs as its own job so a dependency advisory is
      # distinguishable from a code failure, and so it still reports when
      # the workspace job fails.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
