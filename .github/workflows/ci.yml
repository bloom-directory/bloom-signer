name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Assert Bloom product repo is absent
        run: |
          if grep -Fq 'source = "git+https://github.com/bloom-directory/bloom.git' Cargo.lock; then
            echo 'Cargo.lock must not resolve packages from the Bloom product repository' >&2
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features --locked
      - name: Keep the accepted time advisory out of the default artifact
        run: |
          if cargo tree --locked -p bloom-signer -e normal --prefix none | grep -Eq '^time v'; then
            echo 'the default bloom-signer graph must not contain time while RUSTSEC-2026-0009 is ignored for the optional AWS KMS graph' >&2
            exit 1
          fi

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Advisories, licences, sources, and wildcard pins, configured in
      # deny.toml. Runs as its own job so a dependency advisory is
      # distinguishable from a code failure, and so it still reports when
      # the workspace job fails.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
