[package]
name = "bloom-signer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["local"]
local = ["dep:bloom-signer-backend-local"]
aws-kms = ["dep:bloom-signer-backend-aws-kms"]
triad-dev-harness = ["bloom-triad-local-transport/triad-dev-harness"]

[dependencies]
bloom-signer-api.workspace = true
bloom-triad-local-transport.workspace = true
bloom-audit-checkpoint.workspace = true
bloom-service-activation.workspace = true
bloom-trusted-time.workspace = true
bloom-signer-backend-api = { path = "../bloom-signer-backend-api" }
bloom-signer-backend-local = { path = "../bloom-signer-backend-local", optional = true }
bloom-signer-backend-aws-kms = { path = "../bloom-signer-backend-aws-kms", optional = true }
chacha20poly1305.workspace = true
ciborium.workspace = true
ed25519-dalek.workspace = true
futures.workspace = true
hex.workspace = true
hpke.workspace = true
hkdf.workspace = true
k256.workspace = true
parking_lot.workspace = true
p256.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_jcs.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"
k256.workspace = true
