# Supply-chain gate for the Bloom Signer.
#
# The Signer holds root key material, so the question this file answers is
# narrow: what code ends up inside a Signer build, and is any of it known to
# be vulnerable, unmaintained, or from somewhere we did not intend?

[graph]
# Gate what ships, not what tests. `cargo audit` and a default `cargo deny`
# both read Cargo.lock, which lists dev-dependencies, so a test-only crate
# reads as production exposure.
exclude-dev = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Maintained ureq/rustls trust-anchor data used by the pinned relay admin
  # client. This is permissive data licensing, not executable ceremony code.
  "CDLA-Permissive-2.0",
  # rust-bip39 and its rust-bitcoin hash/hex dependencies are dedicated to
  # the public domain under CC0. They implement the imported mnemonic codec.
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
# Catch a dependency pinned to "*", which would let any future version in.
# Intra-workspace crates are path dependencies carrying no version, which
# is the same shape but not the same risk, so they are exempted.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Runtime transport and the hosted relay's protocol/admin client. Workspace
# manifests pin exact revisions; these entries only allow their source hosts.
allow-git = [
  "https://github.com/bloom-directory/bloom-service-runtime",
  "https://github.com/bloom-directory/bloom-relay",
]
